services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam_local_only
      POSTGRES_DB: exam_platform
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
volumes:
  postgres-data:
  redis-data:
