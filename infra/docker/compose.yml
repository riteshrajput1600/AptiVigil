services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-exam_platform}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-s3.iam=false"]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweed-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
  queue:
    image: softwaremill/elasticmq-native:1.6.12
    ports: ["${SQS_PORT:-9324}:9324"]
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
  mail:
    image: axllent/mailpit:v1.27.4
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"
volumes:
  postgres-data:
  redis-data:
  seaweed-data:
