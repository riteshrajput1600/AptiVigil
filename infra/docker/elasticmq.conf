include "application.conf"

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-hostname = "0.0.0.0"
  bind-port = 9324
}
queues {
  events { defaultVisibilityTimeout = 30 seconds, delay = 0 seconds, receiveMessageWait = 0 seconds }
  reports { defaultVisibilityTimeout = 60 seconds, delay = 0 seconds, receiveMessageWait = 0 seconds }
  notifications { defaultVisibilityTimeout = 30 seconds, delay = 0 seconds, receiveMessageWait = 0 seconds }
  events-dlq { defaultVisibilityTimeout = 30 seconds, delay = 0 seconds, receiveMessageWait = 0 seconds }
  reports-dlq { defaultVisibilityTimeout = 30 seconds, delay = 0 seconds, receiveMessageWait = 0 seconds }
  notifications-dlq { defaultVisibilityTimeout = 30 seconds, delay = 0 seconds, receiveMessageWait = 0 seconds }
}
